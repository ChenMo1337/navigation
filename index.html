<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猫memeAI资讯站</title>
    <link rel="stylesheet" href="./xiny/fontawesome/css/all.min.css">
    <link rel="icon" href="./xiny/favicon.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* 换上了更现代的苹果科技风字体 */
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", STHeiti, "Microsoft Yahei", Tahoma, Simsun, sans-serif;
            min-height: 100vh;
            /* 极光渐变兜底背景，即使图片加载失败也非常好看 */
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            background-attachment: fixed;
            transition: all 0.3s ease;
            overflow-x: hidden;
            position: relative;
        }

        /* 必应高清背景图片 */
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -1;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }

        .bg-image.loaded {
            opacity: 1;
        }

        /* 加载动画 */
        .loading-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: all 0.8s ease;
        }

        .loading-container.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .sk-chase {
            width: 40px;
            height: 40px;
            position: relative;
            animation: sk-chase 2.5s infinite linear both;
        }

        .sk-chase-dot {
            width: 100%;
            height: 100%;
            position: absolute;
            left: 0;
            top: 0;
            animation: sk-chase-dot 2.0s infinite ease-in-out both;
        }

        .sk-chase-dot:before {
            content: '';
            display: block;
            width: 25%;
            height: 25%;
            background-color: #fff;
            border-radius: 100%;
            animation: sk-chase-dot-before 2.0s infinite ease-in-out both;
        }

        .sk-chase-dot:nth-child(1) { animation-delay: -1.1s; }
        .sk-chase-dot:nth-child(2) { animation-delay: -1.0s; }
        .sk-chase-dot:nth-child(3) { animation-delay: -0.9s; }
        .sk-chase-dot:nth-child(4) { animation-delay: -0.8s; }
        .sk-chase-dot:nth-child(5) { animation-delay: -0.7s; }
        .sk-chase-dot:nth-child(6) { animation-delay: -0.6s; }
        .sk-chase-dot:nth-child(1):before { animation-delay: -1.1s; }
        .sk-chase-dot:nth-child(2):before { animation-delay: -1.0s; }
        .sk-chase-dot:nth-child(3):before { animation-delay: -0.9s; }
        .sk-chase-dot:nth-child(4):before { animation-delay: -0.8s; }
        .sk-chase-dot:nth-child(5):before { animation-delay: -0.7s; }
        .sk-chase-dot:nth-child(6):before { animation-delay: -0.6s; }

        @keyframes sk-chase { 100% { transform: rotate(360deg); } }
        @keyframes sk-chase-dot { 80%, 100% { transform: rotate(360deg); } }
        @keyframes sk-chase-dot-before { 50% { transform: scale(0.4); } 100%, 0% { transform: scale(1.0); } }

        /* 主容器 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 4rem 2rem 3rem 2rem;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease;
        }

        .container.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* 头部 */
        .header {
            text-align: center;
            margin-bottom: 3.5rem;
            color: white;
        }

        .header h1 {
            font-size: 2.8rem;
            font-weight: 400;
            margin-bottom: 0.8rem;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
            letter-spacing: 2px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
            text-shadow: 0 1px 5px rgba(0, 0, 0, 0.4);
            letter-spacing: 1px;
        }

        /* 导航分组与卡片 */
        .section { margin-bottom: 3rem; }
        
        .section-title {
            color: white;
            font-size: 1.5rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
            text-align: center;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 3px;
            border-radius: 2px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
        }

        .cards-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center; 
            gap: 1.5rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .card {
            width: 160px;
            flex: 0 0 auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 1.5rem;
            text-decoration: none;
            color: white;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .card:hover {
            transform: translateY(-8px) scale(1.02);
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .card-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            font-size: 1.8rem;
            transition: all 0.3s ease;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .card:hover .card-icon {
            transform: scale(1.15) rotateY(10deg);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 500;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
        }

        /* 底部精美小部件容器 (时间和天气) */
        .widgets-section {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            justify-content: center;
            max-width: 800px;
            margin: 4rem auto 1rem auto;
        }

        .glass-widget {
            flex: 1;
            min-width: 260px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 24px;
            padding: 2rem;
            color: white;
            text-align: center;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            transition: transform 0.4s ease, background 0.4s ease;
        }

        .glass-widget:hover {
            transform: translateY(-5px);
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        /* 时钟排版 */
        .time-display {
            font-size: 3.5rem;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            font-variant-numeric: tabular-nums; /* 数字等宽对齐 */
        }

        .date-display {
            font-size: 1.1rem;
            opacity: 0.85;
            letter-spacing: 1px;
        }

        /* 天气排版 */
        .weather-top {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            opacity: 0.9;
        }

        .weather-temp {
            font-size: 3.5rem;
            font-weight: 300;
            margin: 0.2rem 0;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .weather-desc {
            font-size: 1.1rem;
            opacity: 0.85;
            letter-spacing: 1px;
        }

        /* 响应式适配 */
        @media (max-width: 768px) {
            .widgets-section { flex-direction: column; }
            .time-display, .weather-temp { font-size: 3rem; }
            .header h1 { font-size: 2.2rem; }
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.6); }
    </style>
</head>

<body>
    <!-- 背景图片容器 -->
    <div class="bg-image" id="bgImage"></div>

    <!-- 初始加载动画 -->
    <div class="loading-container" id="loadingContainer">
        <div class="sk-chase">
            <div class="sk-chase-dot"></div><div class="sk-chase-dot"></div>
            <div class="sk-chase-dot"></div><div class="sk-chase-dot"></div>
            <div class="sk-chase-dot"></div><div class="sk-chase-dot"></div>
        </div>
    </div>

    <!-- 主容器 -->
    <div class="container" id="mainContainer">
        <header class="header">
            <h1>猫memeAI资讯站</h1>
            <p>前沿AI资讯一网打尽 赋能你的数字未来</p>
        </header>

        <!-- 导航卡片注入区 -->
        <div id="content"></div>

        <!-- 底部大卡片：时间和天气 -->
        <div class="widgets-section">
            <!-- 精美时钟卡片 -->
            <div class="glass-widget">
                <div class="time-display" id="largeTime">00:00</div>
                <div class="date-display" id="largeDate">加载中...</div>
            </div>

            <!-- 智能天气卡片 -->
            <div class="glass-widget">
                <div class="weather-top">
                    <i class="fas fa-map-marker-alt"></i>
                    <span id="wCity">定位中...</span>
                </div>
                <div class="weather-temp" id="wTemp">--°C</div>
                <div class="weather-desc" id="wDesc">正在获取天气状况</div>
            </div>
        </div>
    </div>

    <script>
        let config = null;

        // 1. 设置高清背景图片（使用必应每日壁纸，超稳定）
        function setBackground() {
            const bgImage = document.getElementById('bgImage');
            // 采用稳定的 Bing 壁纸 API
            const imageUrl = `https://api.vvhan.com/api/wallpaper/views?t=${Date.now()}`;
            
            const img = new Image();
            img.src = imageUrl;
            img.onload = () => {
                bgImage.style.backgroundImage = `url(${imageUrl})`;
                bgImage.classList.add('loaded');
            };
            // 如果图片加载失败，CSS中预设的极光渐变背景会自动生效，不影响美观
        }

        // 2. 实时时钟引擎
        function updateTimeWidget() {
            const timeEl = document.getElementById('largeTime');
            const dateEl = document.getElementById('largeDate');
            const now = new Date();
            
            // 处理时间
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            timeEl.innerText = `${hours}:${minutes}:${seconds}`;

            // 处理日期
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const dayName = days[now.getDay()];
            
            dateEl.innerText = `${year}年${month}月${date}日 ${dayName}`;
        }
        setInterval(updateTimeWidget, 1000);
        updateTimeWidget();

        // 3. 智能获取IP天气 (采用免费免密的 wttr 接口)
        async function loadWeather() {
            try {
                // 这个接口会自动识别用户的 IP 并返回当地天气
                const response = await fetch('https://wttr.in/?format=j1&lang=zh-cn');
                if (!response.ok) throw new Error('网络响应异常');
                const data = await response.json();
                
                const temp = data.current_condition[0].temp_C;
                const desc = data.current_condition[0].lang_zh[0].value;
                const city = data.nearest_area[0].areaName[0].value;

                document.getElementById('wTemp').innerText = `${temp}°C`;
                document.getElementById('wCity').innerText = city;
                document.getElementById('wDesc').innerText = desc;
            } catch (error) {
                console.error("天气加载失败", error);
                document.getElementById('wTemp').innerText = '--°C';
                document.getElementById('wCity').innerText = '未知地区';
                document.getElementById('wDesc').innerText = '天气信息获取失败';
            }
        }

        // 4. 加载配置文件并渲染卡片
        function fetchWithTimeout(url, timeout = 2000) {
            return Promise.race([
                fetch(url),
                new Promise((_, reject) => setTimeout(() => reject(new Error('请求超时')), timeout))
            ]);
        }

        async function loadConfigWithRetries(url, maxRetries = 3) {
            for (let attempt = 1; attempt <= maxRetries; attempt++) {
                try {
                    const res = await fetchWithTimeout(url, 2000);
                    if (!res.ok) throw new Error(`状态码错误: ${res.status}`);
                    return await res.json();
                } catch (err) {
                    if (attempt === maxRetries) throw err;
                }
            }
        }

        function createCard(item) {
            return `
                <a href="${item.url}" class="card" target="_blank">
                    <div class="card-icon">
                        <i class="${item.icon}"></i>
                    </div>
                    <div class="card-title">${item.name}</div>
                </a>
            `;
        }

        function renderContent() {
            const content = document.getElementById('content');
            let html = '';
            Object.keys(config).forEach(sectionName => {
                html += `
                    <div class="section">
                        <h2 class="section-title">${sectionName}</h2>
                        <div class="cards-grid">
                            ${config[sectionName].map(createCard).join('')}
                        </div>
                    </div>
                `;
            });
            content.innerHTML = html;
        }

        // 5. 初始化核心逻辑
        async function init() {
            setBackground();
            loadWeather(); // 异步加载天气，不阻塞页面

            try {
                const configPromise = loadConfigWithRetries(`navigation.json?t=${Date.now()}`);
                const domReadyPromise = new Promise(resolve => {
                    if (document.readyState === 'loading') {
                        document.addEventListener('DOMContentLoaded', resolve);
                    } else {
                        resolve();
                    }
                });

                const [loadedConfig] = await Promise.all([configPromise, domReadyPromise]);
                config = loadedConfig;
                renderContent();
            } catch (err) {
                console.error('加载配置失败:', err);
                document.getElementById('content').innerHTML = `
                    <div class="cards-grid">
                        <div class="card" style="padding: 2rem;">
                            <div class="card-icon" style="color: #ff6b6b;"><i class="fas fa-exclamation-triangle"></i></div>
                            <div class="card-title">配置加载失败</div>
                        </div>
                    </div>`;
            } finally {
                setTimeout(() => {
                    document.getElementById('loadingContainer').classList.add('hidden');
                    document.getElementById('mainContainer').classList.add('visible');
                }, 500);
            }
        }

        init();
    </script>
</body>

</html>
